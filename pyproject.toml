[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "captioning"
version = "0.1.0"
description = "Lightweight on-device image captioning for screen-reader users (IE7615)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

